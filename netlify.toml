[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/espace-organisateurs*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/orga/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Anciennes adresses de l'espace organisateurs (favoris, écran d'accueil) : vers la page de connexion actuelle
[[redirects]]
  from = "/espace-organisateurs%20(1).html"
  to = "/espace-organisateurs.html"
  status = 301
  force = true

[[redirects]]
  from = "/espace-organisateurs/*"
  to = "/espace-organisateurs.html"
  status = 301
  force = true

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
