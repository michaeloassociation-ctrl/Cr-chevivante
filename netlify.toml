[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/espace-organisateurs*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/orga/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# Ancien nom du contenu chiffré de l'espace organisateurs
[[redirects]]
  from = "/espace-organisateurs%20(1).html"
  to = "/orga/contenu.html"
  status = 301

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
