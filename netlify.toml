[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/espace-organisateurs*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/orga/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
